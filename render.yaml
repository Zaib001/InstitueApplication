# Render Blueprint specification for Monsieur Fanyi (Free Tier Compatible)
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: monsieur-fanyi
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run render:start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.18.0
      - key: DATABASE_URL
        fromDatabase:
          name: monsieur-fanyi-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: SESSION_MAX_AGE_SECONDS
        value: "604800"
      - key: DEFAULT_PLATFORM_COMMISSION_PERCENT
        value: "15"
      - key: PAYMENT_MOCK_ENABLED
        value: "true"
      - key: STORAGE_PROVIDER
        value: "local"
      - key: UPLOAD_MAX_FILE_SIZE_MB
        value: "5"
      - key: ADMIN_BOOTSTRAP_EMAIL
        value: "admin@monsieurfanyi.gn"
      - key: ADMIN_BOOTSTRAP_PASSWORD
        generateValue: true
      - key: ADMIN_BOOTSTRAP_NAME
        value: "Administrateur National Monsieur Fanyi"

databases:
  - name: monsieur-fanyi-db
    plan: free
    region: frankfurt
    databaseName: monsieur_fanyi
    user: monsieur_fanyi_user
